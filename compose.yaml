services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: novabank
      POSTGRES_USER: novabank
      POSTGRES_PASSWORD: novabank_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novabank -d novabank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
